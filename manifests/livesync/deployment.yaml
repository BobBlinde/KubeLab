apiVersion: apps/v1
kind: Deployment
metadata:
  name: livesync
  namespace: livesync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: livesync
  template:
    metadata:
      labels:
        app: livesync
    spec:
      initContainers:
        # The entrypoint chowns everything under /opt/couchdb and exits if that fails,
        # which it does on a read-only ConfigMap mount, so copy the config to a writable dir
        - name: config
          image: couchdb:3.5.3
          command: ["cp", "/config/livesync.ini", "/local.d/livesync.ini"]
          volumeMounts:
            - name: config
              mountPath: /config
            - name: local-d
              mountPath: /local.d
      containers:
        - name: couchdb
          image: couchdb:3.5.3
          env:
            # The entrypoint writes these to local.d/docker.ini on every start
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: livesync-secrets
                  key: couchdb-user
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: livesync-secrets
                  key: couchdb-password
          ports:
            - name: http
              containerPort: 5984
          # TCP probes: every HTTP endpoint (including /_up) needs auth with require_valid_user
          readinessProbe:
            tcpSocket:
              port: 5984
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5984
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /opt/couchdb/data
            - name: local-d
              mountPath: /opt/couchdb/etc/local.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: livesync-data
        - name: config
          configMap:
            name: livesync-couchdb
        - name: local-d
          emptyDir: {}
