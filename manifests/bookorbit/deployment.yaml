apiVersion: apps/v1
kind: Deployment
metadata:
  name: bookorbit
  namespace: bookorbit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bookorbit
  template:
    metadata:
      labels:
        app: bookorbit
    spec:
      containers:
        - name: bookorbit
          image: ghcr.io/bookorbit/bookorbit:latest
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: APP_URL
              value: https://bookorbit.blinde.net
            - name: POSTGRES_HOST
              value: bookorbit-postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: bookorbit-secrets
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bookorbit-secrets
                  key: postgres-password
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: bookorbit-secrets
                  key: postgres-db
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bookorbit-secrets
                  key: jwt-secret
            - name: SETUP_BOOTSTRAP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bookorbit-secrets
                  key: setup-bootstrap-token
            # PUID/PGID must match the ownership of /data/books on the node
            # so BookOrbit can read/write the library during scans.
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Etc/UTC
          ports:
            - name: http
              containerPort: 3000
          volumeMounts:
            - name: data
              mountPath: /data
            - name: books
              mountPath: /books
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: bookorbit-data
        - name: books
          hostPath:
            path: /data/books
            type: DirectoryOrCreate
