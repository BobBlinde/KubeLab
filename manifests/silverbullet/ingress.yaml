apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: silverbullet
  namespace: silverbullet
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - silverbullet.blinde.net
      secretName: silverbullet-tls
  rules:
    - host: silverbullet.blinde.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: silverbullet
                port:
                  number: 80
