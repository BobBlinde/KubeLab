apiVersion: apps/v1
kind: Deployment
metadata:
  name: silverbullet
  namespace: silverbullet
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: silverbullet
  template:
    metadata:
      labels:
        app: silverbullet
    spec:
      containers:
        - name: silverbullet
          image: ghcr.io/silverbulletmd/silverbullet:2.12.1
          env:
            # SB_USER is "user:password" and enables the login page.
            - name: SB_USER
              valueFrom:
                secretKeyRef:
                  name: silverbullet-secrets
                  key: sb-user
            - name: TZ
              value: Etc/UTC
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /.instance
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: silverbullet-data
