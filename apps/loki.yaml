apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    # The OSS Loki chart moved to grafana-community; the `loki` chart left in
    # grafana/helm-charts is now the Grafana Enterprise Logs chart.
    repoURL: oci://ghcr.io/grafana-community/helm-charts/loki
    path: "."
    targetRevision: "21.0.0"
    helm:
      values: |
        # Single process, chunks + index on a local-path PVC. No object storage.
        deploymentMode: Monolithic

        loki:
          auth_enabled: false
          commonConfig:
            replication_factor: 1
          storage:
            type: filesystem
          schemaConfig:
            configs:
              - from: "2026-11-01"
                store: tsdb
                object_store: filesystem
                schema: v13
                index:
                  prefix: index_
                  period: 24h
          limits_config:
            retention_period: 720h
          compactor:
            retention_enabled: true
            delete_request_store: filesystem

        singleBinary:
          replicas: 1
          persistence:
            size: 20Gi
            storageClass: local-path

        # Simple-scalable targets default to 3 replicas each; the chart refuses
        # to render them alongside a filesystem-backed monolith.
        write:
          replicas: 0
        read:
          replicas: 0
        backend:
          replicas: 0

        # Not needed at homelab scale. chunksCache alone requests 8GiB.
        chunksCache:
          enabled: false
        resultsCache:
          enabled: false
        gateway:
          enabled: false
        lokiCanary:
          enabled: false
        test:
          enabled: false

        monitoring:
          serviceMonitor:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
